<!DOCTYPE html>
<html lang="id">

<head>
  <title>{{PAGE_TITLE}}</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta http-equiv="pragma" content="no-cache">
  <meta http-equiv="expires" content="-1">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="main">
    <div class="box brandbox">
      {{#LOGO}}<img class="logo" src="{{LOGO}}" alt="{{PAGE_TITLE}}">{{/LOGO}}
      <h3 class="brand">Terjadi kesalahan</h3>
    </div>

    <div class="notice">$(error)</div>

    <a class="button" href="$(link-login)">Kembali ke halaman login</a>
    {{#WA_LINK}}<a class="button2" href="{{WA_LINK}}">{{WA_LABEL}}</a>{{/WA_LINK}}

    <div class="foot">
      {{#FOOTER}}{{FOOTER}}{{/FOOTER}}
    </div>
  </div>

</body>

</html>
