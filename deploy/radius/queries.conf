# -*- text -*-
#
#  Query FreeRADIUS untuk generator_mikrotik. Menggantikan mods-config/sql/main/mysql/queries.conf bawaan.
#
#  Data akun dibaca dari view di database aplikasi (dibuat migrasi prisma/migrations/*_vpn_radius):
#    radius_nas    daftar CHR (dibaca sekali saat FreeRADIUS mulai; server baru = restart container)
#    radius_check  NT-Password + Simultaneous-Use untuk akun aktif
#    radius_reply  Framed-IP-Address + Mikrotik-Rate-Limit
#  Accounting ditulis ke tabel radacct (waktu dalam UTC, sama dengan Prisma).
#
#  Setiap akun terikat ke satu server: query authorize memfilter server_id dengan id server yang
#  mengirim permintaan (%{client:shortname} = kolom shortname di radius_nas = id server).

safe_characters = "@abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789.-_: /"

sql_user_name = "%{User-Name}"

client_query = "\
	SELECT id, nasname, shortname, type, secret, server \
	FROM radius_nas"

authorize_check_query = "\
	SELECT id, username, attribute, value, op \
	FROM radius_check \
	WHERE username = '%{SQL-User-Name}' AND server_id = '%{client:shortname}' \
	ORDER BY id"

authorize_reply_query = "\
	SELECT id, username, attribute, value, op \
	FROM radius_reply \
	WHERE username = '%{SQL-User-Name}' AND server_id = '%{client:shortname}' \
	ORDER BY id"

#  Sesi dianggap masih berjalan hanya bila ada interim-update dalam 15 menit terakhir (CHR mengirim
#  tiap 5 menit). Sesi yang tertinggal karena CHR mati mendadak tidak mengunci akun.
simul_count_query = "\
	SELECT COUNT(*) \
	FROM radacct \
	WHERE username = '%{SQL-User-Name}' \
	AND acctstoptime IS NULL \
	AND acctupdatetime > UTC_TIMESTAMP() - INTERVAL 15 MINUTE"

accounting {
	reference = "%{tolower:type.%{Acct-Status-Type}.query}"

	type {
		#  CHR menyala ulang / mematikan accounting: tutup semua sesi terbuka dari CHR itu.
		accounting-on {
			query = "\
				UPDATE radacct \
				SET acctstoptime = UTC_TIMESTAMP(), \
					acctterminatecause = '%{%{Acct-Terminate-Cause}:-NAS-Reboot}' \
				WHERE acctstoptime IS NULL \
				AND nasipaddress = '%{Packet-Src-IP-Address}'"
		}

		accounting-off {
			query = "${..accounting-on.query}"
		}

		start {
			query = "\
				INSERT INTO radacct \
					(acctsessionid, acctuniqueid, username, nasipaddress, nasportid, \
					acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, \
					acctinputoctets, acctoutputoctets, callingstationid, acctterminatecause, framedipaddress) \
				VALUES \
					('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
					'%{Packet-Src-IP-Address}', '%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					UTC_TIMESTAMP(), UTC_TIMESTAMP(), NULL, 0, \
					0, 0, '%{Calling-Station-Id}', '', '%{Framed-IP-Address}')"

			#  Start terkirim dua kali: cukup segarkan waktunya.
			query = "\
				UPDATE radacct \
				SET acctupdatetime = UTC_TIMESTAMP() \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"
		}

		interim-update {
			query = "\
				UPDATE radacct \
				SET acctupdatetime = UTC_TIMESTAMP(), \
					acctsessiontime = '%{%{Acct-Session-Time}:-0}', \
					acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}' << 32 | '%{%{Acct-Input-Octets}:-0}', \
					acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}' << 32 | '%{%{Acct-Output-Octets}:-0}', \
					framedipaddress = '%{Framed-IP-Address}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

			#  Start tidak pernah sampai: buat barisnya dari interim-update.
			query = "\
				INSERT INTO radacct \
					(acctsessionid, acctuniqueid, username, nasipaddress, nasportid, \
					acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, \
					acctinputoctets, acctoutputoctets, callingstationid, acctterminatecause, framedipaddress) \
				VALUES \
					('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
					'%{Packet-Src-IP-Address}', '%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					UTC_TIMESTAMP() - INTERVAL '%{%{Acct-Session-Time}:-0}' SECOND, UTC_TIMESTAMP(), NULL, \
					'%{%{Acct-Session-Time}:-0}', \
					'%{%{Acct-Input-Gigawords}:-0}' << 32 | '%{%{Acct-Input-Octets}:-0}', \
					'%{%{Acct-Output-Gigawords}:-0}' << 32 | '%{%{Acct-Output-Octets}:-0}', \
					'%{Calling-Station-Id}', '', '%{Framed-IP-Address}')"
		}

		stop {
			query = "\
				UPDATE radacct \
				SET acctstoptime = UTC_TIMESTAMP(), \
					acctupdatetime = UTC_TIMESTAMP(), \
					acctsessiontime = '%{%{Acct-Session-Time}:-0}', \
					acctinputoctets = '%{%{Acct-Input-Gigawords}:-0}' << 32 | '%{%{Acct-Input-Octets}:-0}', \
					acctoutputoctets = '%{%{Acct-Output-Gigawords}:-0}' << 32 | '%{%{Acct-Output-Octets}:-0}', \
					acctterminatecause = '%{Acct-Terminate-Cause}' \
				WHERE acctuniqueid = '%{Acct-Unique-Session-Id}'"

			query = "\
				INSERT INTO radacct \
					(acctsessionid, acctuniqueid, username, nasipaddress, nasportid, \
					acctstarttime, acctupdatetime, acctstoptime, acctsessiontime, \
					acctinputoctets, acctoutputoctets, callingstationid, acctterminatecause, framedipaddress) \
				VALUES \
					('%{Acct-Session-Id}', '%{Acct-Unique-Session-Id}', '%{SQL-User-Name}', \
					'%{Packet-Src-IP-Address}', '%{%{NAS-Port-ID}:-%{NAS-Port}}', \
					UTC_TIMESTAMP() - INTERVAL '%{%{Acct-Session-Time}:-0}' SECOND, UTC_TIMESTAMP(), UTC_TIMESTAMP(), \
					'%{%{Acct-Session-Time}:-0}', \
					'%{%{Acct-Input-Gigawords}:-0}' << 32 | '%{%{Acct-Input-Octets}:-0}', \
					'%{%{Acct-Output-Gigawords}:-0}' << 32 | '%{%{Acct-Output-Octets}:-0}', \
					'%{Calling-Station-Id}', '%{Acct-Terminate-Cause}', '%{Framed-IP-Address}')"
		}
	}
}
