<!DOCTYPE html>
<html lang="id">

<head>
  <title id="title">{{TITLE}}</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <script language="JavaScript">
    function startRedirect() {
      $(if popup == 'true')
      open('$(link-status)', 'hotspot_status',
        'toolbar=0,location=0,directories=0,status=0,menubars=0,resizable=1,width=300,height=320');
      $(endif)
      location.href = '$(link-redirect)';
    }
  </script>
</head>

<body onLoad="startRedirect()">
  <div class="main">
    <div class="box brandbox">
      {{#LOGO}}<img class="logo" src="{{LOGO}}" alt="{{TITLE}}">{{/LOGO}}
      <h3 class="brand">Berhasil masuk</h3>
      <p class="subtitle">Anda sudah terhubung ke internet. Halaman akan dialihkan otomatis.</p>
    </div>

    <table class="table2">
      <tr><td>Username</td><td>$(username)</td></tr>
      <tr><td>IP Address</td><td>$(ip)</td></tr>
    </table>

    <a class="button" href="$(link-redirect)">Lanjutkan sekarang</a>

    <div class="foot">
      {{#FOOTER}}{{FOOTER}}{{/FOOTER}}
    </div>
  </div>

  <script type="text/javascript">
    document.getElementById('title').innerHTML = window.location.hostname + " > redirect";
  </script>
</body>

</html>
