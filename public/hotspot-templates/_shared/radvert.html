<!DOCTYPE html>
<html lang="id">

<head>
  <title>{{PAGE_TITLE}}</title>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="style.css">
  <meta http-equiv="refresh" content="$(refresh-timeout-secs); url=$(link-redirect)">
</head>

<body>
  <div class="main">
    <div class="box brandbox">
      {{#LOGO}}<img class="logo" src="{{LOGO}}" alt="{{PAGE_TITLE}}">{{/LOGO}}
      <h3 class="brand">Sedang membuka iklan</h3>
      <p class="subtitle">
        Halaman iklan akan terbuka otomatis. Setelah selesai, koneksi internet Anda
        dilanjutkan kembali.
      </p>
    </div>

    <a class="button" href="$(link-redirect)">Lanjutkan</a>

    <div class="foot">
      {{#FOOTER}}{{FOOTER}}{{/FOOTER}}
    </div>
  </div>

</body>

</html>
